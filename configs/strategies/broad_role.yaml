id: broad_role
version: "1"
kind: broad_role
description: Intentionally permissive fixed role (service-wide integration role).
administrative_configuration: One role, all tools, all accounts across tenants, no limits.
threat_assumptions: [agent is trusted to behave; no content-based manipulation considered]
fail_mode: closed
delegation: {mode: forward, max_depth: 99}
role:
  name: agent_full
  tools: [get_account, list_transactions, transfer_funds, update_contact, create_payee, export_statement, delegate_task]
