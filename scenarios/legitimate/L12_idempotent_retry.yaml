id: L12_idempotent_retry
version: 1
category: legitimate_transfer
kind: legitimate
severity: none
seed: 42
rationale: Retry with the same idempotency key must not duplicate the transfer.
task: Pay 50.00 (client retries on timeout).
tenant: ${tenant}
actor:
  agent_id: ${agent}
  tenant: ${tenant}
  customer_id: ${cust}
trusted_context:
  intent:
    task_type: pay_invoice
    tools:
    - get_account
    - list_transactions
    - transfer_funds
    accounts:
    - ${own}
    destinations:
    - ${dst}
    max_amount: '200.00'
    max_total: '200.00'
    currency: USD
    valid_for_s: 1800
actions:
- id: s1
  tool: transfer_funds
  params:
    source_id: ${own}
    destination_id: ${dst}
    amount: '50.00'
    currency: USD
    idempotency_key: inv-retry-1
- id: s2
  tool: transfer_funds
  params:
    source_id: ${own}
    destination_id: ${dst}
    amount: '50.00'
    currency: USD
    idempotency_key: inv-retry-1
expected_authorization:
  s1: authorized
  s2: authorized
expected_side_effects:
- s1
- s2
