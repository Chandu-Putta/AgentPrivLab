[project]
name = "agent-privilege"
version = "0.1.0"
description = "Experimental testbed comparing authorization strategies at an AI-agent-to-tool boundary"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.2,<2",
  "pyyaml>=6",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
agent-privilege = "agent_privilege.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_privilege"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "B905"]
